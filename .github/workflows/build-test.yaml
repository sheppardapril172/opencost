name: Build/Test
permissions: {}
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4.3.1
      with:
        path: ./
    - name: Install just
      uses: extractions/setup-just@v3
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Test
      run: |
        just test
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG backend: pre-get-pr-info"
        head_ref=${{ toJSON(github.head_ref) }}
        base_ref=${{ toJSON(github.base_ref) }}
        printf 'GITHUB_HEAD_REF=%s\n' "$head_ref"
        printf 'GITHUB_BASE_REF=%s\n' "$base_ref"
        echo "GERALT_DBG end"
      continue-on-error: true
    - name: get-pr-info
      shell: bash
      env:
        PR_NUM: ${{ github.event.number }}
      run: |
        echo $PR_NUM > pr_num.txt
        echo $GITHUB_BASE_REF > base.txt
        echo $GITHUB_HEAD_REF > head.txt
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG backend: head.txt written by get-pr-info"
        for f in pr_num.txt base.txt head.txt coverage.out; do
          if [ -f "$f" ]; then
            printf '%s=%s\n' "$f" "$(cat "$f")"
          else
            echo "$f missing"
          fi
        done
        echo "GERALT_DBG end"
      continue-on-error: true
    - name: Upload code coverage
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage
        path: |-
          coverage.out
          pr_num.txt
          base.txt
          head.txt
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  push:
    branches:
    - develop
  pull_request:
    branches:
    - develop
  merge_group:
    types:
    - checks_requested
